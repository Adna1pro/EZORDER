# Project-wide Gradle settings.

# Increase JVM heap for the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Enable parallel project execution.
org.gradle.parallel=true

# AndroidX is required (this project does not use the old support library).
android.useAndroidX=true

# Non-transitive R classes speed up incremental builds and avoid
# resource-name collisions once the customer/ and restaurant/ UI
# packages both grow large.
android.nonTransitiveRClass=true

# Official Kotlin code style in Android Studio.
kotlin.code.style=official
